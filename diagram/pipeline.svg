<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pipeline-title pipeline-desc" id="pipeline-root">
        <title id="pipeline-title">ClickHouseGNN planned workflow</title>
        <desc id="pipeline-desc">Transactions are ingested into ClickHouse, transformed into historical graph features, used by GraphSAGE and a non-graph baseline, then evaluated and recorded in MLflow.</desc>
        <defs>
      <style>#pipeline-root { color: #2d3142; font-family: 'Geist', system-ui, sans-serif; }
      #pipeline-root .intro { max-width: 700px; margin: 12px 0 28px; color: #4f5d75; font-size: 15px; line-height: 1.6; }
      #pipeline-root .diagram-container { width: 100%; overflow-x: auto; border: 1px solid #d5d6d9; background: #f5f5f5; }
      @media print {
#pipeline-root .diagram-container { overflow-x: visible; }
}</style>
          <pattern id="pipeline-pipeline-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/></pattern>
          <marker id="pipeline-pipeline-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>
        <rect width="1280" height="720" fill="#f5f5f5"/>
        <rect width="1280" height="720" fill="url(#pipeline-pipeline-dots)" opacity="0.55"/>

        <!-- Connectors are drawn before nodes. -->
        <g fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#pipeline-pipeline-arrow)">
          <path d="M240 140 H288"/>
          <path d="M488 140 H536"/>
          <path d="M736 140 H784"/>
          <path d="M888 200 V228 Q888 236 880 236 H832 Q824 236 824 244 V288"/>
          <path d="M1128 200 V240 Q1128 248 1120 248 V288"/>
          <path d="M824 400 V436 Q824 444 832 444 H892 Q900 444 900 452 V488"/>
          <path d="M1120 400 V452 Q1120 460 1112 460 H1052 Q1044 460 1044 468 V488"/>
          <path d="M852 544 H680"/>
        </g>

        <!-- The input, storage, feature, model, and evaluation stages are planned. -->
        <rect x="40" y="80" width="200" height="120" rx="20" fill="#ffffff" stroke="#9da4af"/>
        <text x="60" y="108" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="10" letter-spacing="1.2">SOURCE</text>
        <text x="60" y="140" fill="#2d3142" font-family="'Geist', sans-serif" font-size="16" font-weight="600">Transaction data</text>
        <text x="60" y="162" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="12">Transactions + accounts</text>
        <text x="60" y="180" fill="#5a6580" font-family="'Geist Mono', monospace" font-size="10">CSV / Parquet</text>

        <rect x="288" y="80" width="200" height="120" rx="6" fill="#ffffff" stroke="#2d3142"/>
        <text x="308" y="108" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="10" letter-spacing="1.2">01 · INGEST</text>
        <text x="308" y="140" fill="#2d3142" font-family="'Geist', sans-serif" font-size="16" font-weight="600">Load transactions</text>
        <text x="308" y="162" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="12">Preserve identifiers</text>
        <text x="308" y="180" fill="#5a6580" font-family="'Geist', sans-serif" font-size="12">and transaction labels</text>

        <rect x="536" y="80" width="200" height="120" rx="6" fill="#ffffff" stroke="#2d3142"/>
        <text x="556" y="108" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="10" letter-spacing="1.2">02 · STORE</text>
        <text x="556" y="140" fill="#2d3142" font-family="'Geist', sans-serif" font-size="16" font-weight="600">ClickHouse</text>
        <text x="556" y="162" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="12">Transaction tables</text>
        <text x="556" y="180" fill="#5a6580" font-family="'Geist Mono', monospace" font-size="10">MergeTree</text>

        <rect x="784" y="80" width="456" height="120" rx="6" fill="#fdf4f1" stroke="#bf4520" stroke-width="1.5"/>
        <text x="804" y="108" fill="#bf4520" font-family="'Geist Mono', monospace" font-size="10" letter-spacing="1.2">03 · HISTORICAL FEATURES</text>
        <text x="804" y="140" fill="#2d3142" font-family="'Geist', sans-serif" font-size="16" font-weight="600">SQL features and graph inputs</text>
        <text x="804" y="162" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="12">Degree, frequency, volume, counterparties and reciprocity</text>
        <text x="804" y="180" fill="#bf4520" font-family="'Geist', sans-serif" font-size="12" font-weight="600">Use only transactions before the prediction cutoff</text>

        <rect x="704" y="288" width="240" height="112" rx="6" fill="#ffffff" stroke="#2d3142"/>
        <text x="724" y="316" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="10" letter-spacing="1.2">04A · GRAPH MODEL</text>
        <text x="724" y="348" fill="#2d3142" font-family="'Geist', sans-serif" font-size="16" font-weight="600">PyG + GraphSAGE</text>
        <text x="724" y="371" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="12">Construct graph and train GNN</text>

        <rect x="1000" y="288" width="240" height="112" rx="6" fill="#ffffff" stroke="#2d3142"/>
        <text x="1020" y="316" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="10" letter-spacing="1.2">04B · BASELINE</text>
        <text x="1020" y="348" fill="#2d3142" font-family="'Geist', sans-serif" font-size="16" font-weight="600">Non-graph model</text>
        <text x="1020" y="371" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="12">Train on historical features</text>

        <rect x="852" y="488" width="240" height="112" rx="6" fill="#ffffff" stroke="#2d3142"/>
        <text x="872" y="516" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="10" letter-spacing="1.2">05 · EVALUATE</text>
        <text x="872" y="548" fill="#2d3142" font-family="'Geist', sans-serif" font-size="16" font-weight="600">Compare models</text>
        <text x="872" y="570" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="12">Precision · recall · F1 · PR-AUC</text>
        <text x="872" y="588" fill="#5a6580" font-family="'Geist', sans-serif" font-size="12">Time split and SQL benchmark</text>

        <rect x="408" y="488" width="272" height="112" rx="6" fill="#ffffff" stroke="#2d3142"/>
        <text x="428" y="516" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="10" letter-spacing="1.2">06 · TRACK</text>
        <text x="428" y="548" fill="#2d3142" font-family="'Geist', sans-serif" font-size="16" font-weight="600">MLflow</text>
        <text x="428" y="570" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="12">Data versions · config · parameters</text>
        <text x="428" y="588" fill="#5a6580" font-family="'Geist', sans-serif" font-size="12">Metrics · models · artifacts · registry</text>

        <line x1="40" y1="648" x2="1240" y2="648" stroke="#cfd1d6"/>
        <text x="40" y="676" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="10" letter-spacing="1">STATUS</text>
        <text x="112" y="676" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="12">ClickHouse and MLflow services are configured; ingestion, features and model workflows are planned.</text>
      </svg>
